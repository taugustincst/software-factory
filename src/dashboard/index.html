<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
    <title>Factory Floor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%228%22 transform=%22rotate(45 8 8)%22 fill=%22%23ff6b2b%22/%3E%3C/svg%3E"
    />
    <link
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%223%22 width=%2210%22 height=%2210%22 transform=%22rotate(45 8 8)%22 fill=%22%23ff6b2b%22/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f4f2ee;
        --panel: #ffffff;
        --ink: #1c1b19;
        --muted: #6b675f;
        --line: #e2ded6;
        --accent: #d9480f;
        --ok: #2b8a3e;
        --warn: #b7791f;
        --bad: #c92a2a;
        --run: #1971c2;
        --chip: #efebe4;
        --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #121211;
          --panel: #1b1a18;
          --ink: #ecebe7;
          --muted: #9a958b;
          --line: #2d2b27;
          --accent: #ff6b2b;
          --ok: #51cf66;
          --warn: #fcc419;
          --bad: #ff6b6b;
          --run: #4dabf7;
          --chip: #262420;
        }
      }
      :root[data-theme='dark'] {
        --bg: #121211;
        --panel: #1b1a18;
        --ink: #ecebe7;
        --muted: #9a958b;
        --line: #2d2b27;
        --accent: #ff6b2b;
        --ok: #51cf66;
        --warn: #fcc419;
        --bad: #ff6b6b;
        --run: #4dabf7;
        --chip: #262420;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        -webkit-tap-highlight-color: transparent;
      }
      /* Phone first: one column, sticky header, 44px touch targets, 16px inputs. */
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        padding-top: max(8px, env(safe-area-inset-top));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: 60px;
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .brand i {
        width: 12px;
        height: 12px;
        background: var(--accent);
        display: inline-block;
        transform: rotate(45deg);
      }
      .proj {
        display: none;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      header .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--chip);
        color: var(--ink);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        min-height: 44px;
        min-width: 44px;
        touch-action: manipulation;
      }
      button:disabled {
        opacity: 0.6;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      input:focus-visible,
      .run-item:focus-visible,
      .station:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }
      main {
        display: block;
      }
      aside {
        background: var(--panel);
      }
      /* On a phone the list and the run are separate screens. */
      body[data-view='run'] aside,
      body[data-view='list'] .content {
        display: none;
      }
      aside h2,
      section h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin: 16px 16px 8px;
        font-weight: 600;
      }
      section h2 {
        margin: 24px 0 8px;
      }
      .run-item {
        display: block;
        width: 100%;
        min-height: 64px;
        text-align: left;
        border: 0;
        border-left: 3px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: 12px 16px;
        padding-left: max(16px, env(safe-area-inset-left));
        border-bottom: 1px solid var(--line);
      }
      .run-item[aria-current='true'] {
        background: var(--chip);
        border-left-color: var(--accent);
      }
      .run-item .t {
        font-weight: 600;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .run-item .m {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        align-items: center;
      }
      .dots {
        letter-spacing: 2px;
      }
      .content {
        padding: 16px 12px calc(48px + env(safe-area-inset-bottom));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
        min-width: 0;
      }
      .empty {
        color: var(--muted);
        padding: 48px 16px;
        text-align: center;
      }
      .run-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin-bottom: 8px;
      }
      .run-head h1 {
        font-size: 20px;
        line-height: 1.25;
        margin: 0;
        flex: 1 1 100%;
        overflow-wrap: anywhere;
      }
      .run-head .cancel {
        margin-left: auto;
      }
      .badge {
        font-family: var(--mono);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border: 1px solid currentColor;
      }
      .s-passed {
        color: var(--ok);
      }
      .s-failed {
        color: var(--bad);
      }
      .s-running {
        color: var(--run);
      }
      .s-pending {
        color: var(--muted);
      }
      .s-cancelled {
        color: var(--warn);
      }
      .s-paused {
        color: var(--warn);
      }
      .meta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-bottom: 16px;
        overflow-wrap: anywhere;
      }
      .meta a {
        color: var(--accent);
        display: inline-flex;
        align-items: center;
        min-height: 44px;
      }
      .line {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 4px;
        position: relative;
        margin: 8px 0 20px;
      }
      .line::before {
        display: none;
        content: '';
        position: absolute;
        left: 8%;
        right: 8%;
        top: 27px;
        height: 4px;
        background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 16px);
      }
      .station {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        background: none;
        border: 0;
        padding: 4px;
        cursor: pointer;
        color: var(--ink);
      }
      .node {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--panel);
        border: 2px solid var(--line);
        font-family: var(--mono);
        font-weight: 700;
        font-size: 16px;
        transition: border-color 0.2s;
      }
      .station[data-status='passed'] .node {
        border-color: var(--ok);
        color: var(--ok);
      }
      .station[data-status='failed'] .node {
        border-color: var(--bad);
        color: var(--bad);
      }
      .station[data-status='running'] .node {
        border-color: var(--run);
        color: var(--run);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .station[aria-pressed='true'] .node {
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent);
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 6px color-mix(in srgb, var(--run) 25%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .station[data-status='running'] .node {
          animation: none;
        }
      }
      .station .lbl {
        font-weight: 600;
        font-size: 13px;
      }
      .station .sub {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        overflow-wrap: anywhere;
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        min-width: 0;
      }
      .card h3 {
        margin: 0;
        padding: 10px 12px;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tabs button {
        padding: 4px 10px;
        font-size: 12px;
        font-family: var(--mono);
      }
      .tabs button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .checks {
        list-style: none;
        margin: 0;
        padding: 6px 0;
      }
      .checks li {
        padding: 8px 12px;
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 4px;
        overflow-wrap: anywhere;
      }
      .checks .ic {
        font-family: var(--mono);
        font-weight: 700;
      }
      .checks pre {
        grid-column: 2;
        margin: 4px 0 0;
        font: 12px/1.45 var(--mono);
        color: var(--muted);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .summary {
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 220px;
        overflow: auto;
        overscroll-behavior: contain;
      }
      /* Logs wrap instead of scrolling sideways, and their scroll never drags the page. */
      pre.log {
        margin: 0;
        padding: 12px;
        font: 12px/1.5 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 60vh;
        max-height: 60dvh;
        overflow: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        background: color-mix(in srgb, var(--bg) 60%, var(--panel));
      }
      .events {
        list-style: none;
        margin: 0;
        padding: 8px 12px;
        font-family: var(--mono);
        font-size: 12px;
        max-height: 260px;
        overflow: auto;
        overscroll-behavior: contain;
      }
      .events li {
        padding: 3px 0;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .events time {
        color: var(--ink);
        margin-right: 8px;
      }
      /* The new-run form is a full-screen sheet on a phone, with actions at thumb height. */
      dialog {
        border: 0;
        background: var(--panel);
        color: var(--ink);
        width: 100%;
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        margin: 0;
        padding: 0;
        border-radius: 0;
      }
      dialog::backdrop {
        background: rgb(0 0 0 / 0.45);
      }
      dialog form {
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
      }
      dialog h2 {
        margin: 0;
        font-size: 18px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      textarea,
      select {
        font: 16px/1.5 var(--mono);
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        width: 100%;
      }
      select {
        min-height: 48px;
      }
      textarea {
        min-height: 40vh;
        resize: vertical;
        flex: 1;
      }
      input[type='checkbox'] {
        width: 24px;
        height: 24px;
        margin: 0;
        accent-color: var(--accent);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row > label {
        flex: 1 1 100%;
      }
      .row label.check {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        min-height: 44px;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: auto;
      }
      .actions button {
        flex: 1;
        min-height: 48px;
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }
      .err {
        color: var(--bad);
        font-size: 14px;
        min-height: 1em;
        margin: 0;
        overflow-wrap: anywhere;
      }
      /* Improve page: the Steward's digest and the proposal backlog. */
      body[data-page='improve'] main,
      body:not([data-page='improve']) #improvePage {
        display: none;
      }
      #improvePage {
        max-width: 960px;
        margin: 0 auto;
        padding: 16px 12px calc(48px + env(safe-area-inset-bottom));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }
      header button {
        white-space: nowrap;
        flex-shrink: 0;
      }
      .brand {
        min-width: 0;
        overflow: hidden;
      }
      .mode {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 4px 0 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .mode .badge.auto {
        color: var(--warn);
      }
      .mode .badge.required {
        color: var(--ok);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
      }
      .stats div {
        background: var(--panel);
        padding: 10px 12px;
      }
      .stats b {
        display: block;
        font: 700 18px/1.2 var(--mono);
      }
      .stats span {
        font-size: 12px;
        color: var(--muted);
      }
      .prop {
        padding: 12px;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 8px;
      }
      .prop:first-of-type {
        border-top: 0;
      }
      .prop .t {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .prop .m {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        font: 12px var(--mono);
        color: var(--muted);
        align-items: center;
      }
      .risk-low {
        color: var(--ok);
      }
      .risk-medium {
        color: var(--warn);
      }
      .risk-always-human {
        color: var(--bad);
      }
      .prop ul {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      .prop code {
        font: 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .prop .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .prop .acts button {
        flex: 1 1 140px;
      }
      details.more summary {
        cursor: pointer;
        min-height: 44px;
        display: flex;
        align-items: center;
        color: var(--accent);
        font-size: 13px;
      }
      /* Tablet: room for the full six-station line. */
      @media (min-width: 600px) {
        .line {
          grid-template-columns: repeat(6, minmax(0, 1fr));
        }
        .line::before {
          display: block;
        }
        .node {
          width: 58px;
          height: 58px;
        }
        .run-head h1 {
          flex: 0 1 auto;
          font-size: 22px;
        }
        dialog {
          border: 1px solid var(--line);
          border-radius: 12px;
          width: min(640px, calc(100vw - 32px));
          height: auto;
          max-height: calc(100vh - 32px);
          margin: auto;
        }
        dialog form {
          padding: 20px;
          min-height: 0;
        }
        textarea {
          min-height: 200px;
        }
        .row > label {
          flex: 0 1 auto;
        }
        .actions {
          justify-content: flex-end;
          margin-top: 0;
        }
        .actions button {
          flex: 0 0 auto;
        }
      }
      /* Desktop: list and run side by side. */
      @media (min-width: 860px) {
        body {
          font-size: 14px;
        }
        header {
          gap: 16px;
          padding: 10px 20px;
        }
        .proj {
          display: block;
        }
        main {
          display: grid;
          grid-template-columns: 300px 1fr;
          min-height: calc(100vh - 61px);
        }
        body[data-view] aside,
        body[data-view] .content {
          display: block;
        }
        aside {
          border-right: 1px solid var(--line);
          overflow: auto;
          max-height: calc(100vh - 61px);
          position: sticky;
          top: 61px;
        }
        .back {
          display: none;
        }
        .content {
          padding: 20px 24px 60px;
        }
        .grid2 {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr);
        }
        pre.log {
          max-height: 520px;
        }
        .stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body data-view="list">
    <header>
      <div class="brand"><i aria-hidden="true"></i>Factory Floor</div>
      <div class="proj" id="proj"></div>
      <div class="spacer"></div>
      <button id="theme" type="button" aria-label="Toggle color theme">◐</button>
      <button id="pageBtn" type="button" aria-pressed="false">Improve</button>
      <button class="primary" id="newBtn" type="button">New run</button>
    </header>
    <main>
      <aside aria-label="Runs">
        <h2>Runs</h2>
        <div id="runs"></div>
      </aside>
      <section class="content" id="content" aria-live="polite">
        <div class="empty">No runs yet. Start one with <b>New run</b>, or <code>factory run --request "…"</code>.</div>
      </section>
    </main>

    <section id="improvePage" aria-live="polite" aria-labelledby="improveTitle">
      <div class="run-head"><h1 id="improveTitle">Self-improvement</h1></div>
      <div id="improveBody"><div class="empty">Loading…</div></div>
    </section>

    <dialog id="dlg" aria-labelledby="dlgTitle">
      <form id="form" method="dialog">
        <h2 id="dlgTitle">New pipeline run</h2>
        <label
          >Request
          <textarea
            id="req"
            required
            minlength="10"
            maxlength="20000"
            enterkeyhint="enter"
            placeholder="# Add CSV export to the visits table&#10;&#10;Front-desk staff need to export today's visits as CSV for the billing team…"
          ></textarea>
        </label>
        <p class="hint">A rough idea, ticket or issue text. The spec agent turns it into requirements and acceptance criteria.</p>
        <div class="row">
          <label
            >Executor
            <select id="exec">
              <option value="claude">Claude Code (real agents)</option>
              <option value="mock">Mock (offline demo)</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="ship" /> Push and open a PR</label>
        </div>
        <p class="err" id="formErr" role="alert"></p>
        <div class="actions">
          <button type="button" id="cancel">Cancel</button>
          <button class="primary" type="submit">Start run</button>
        </div>
      </form>
    </dialog>

    <script>
      (() => {
        const $ = (s) => document.querySelector(s);
        const el = (tag, attrs = {}, ...kids) => {
          const n = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (k === 'class') n.className = v;
            else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
            else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
          }
          for (const k of kids.flat()) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
          return n;
        };
        const DOT = { passed: '●', failed: '✗', running: '◐', pending: '○' };
        const ICON = { spec: 'S', plan: 'P', build: 'B', test: 'T', review: 'R', ship: '⇪' };
        const state = { runs: [], selected: null, run: null, stage: null, attempt: null, logFor: null };
        // Phones show the run list and a run as separate screens; desktop ignores this.
        const setView = (v) => {
          if (document.body.dataset.view === v) return;
          document.body.dataset.view = v;
          window.scrollTo(0, 0);
        };

        try {
          const t = localStorage.getItem('ff-theme');
          if (t) document.documentElement.dataset.theme = t;
        } catch {}
        $('#theme').onclick = () => {
          const dark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() === '#121211';
          const next = dark ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          try {
            localStorage.setItem('ff-theme', next);
          } catch {}
        };

        const api = async (p, opt) => {
          const r = await fetch(p, opt);
          const ct = r.headers.get('content-type') || '';
          const body = ct.includes('json') ? await r.json() : await r.text();
          if (!r.ok) throw new Error(body.error || r.statusText);
          return body;
        };
        const ago = (iso) => {
          if (!iso) return '';
          const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
          return s < 60
            ? `${s | 0}s ago`
            : s < 3600
              ? `${(s / 60) | 0}m ago`
              : s < 86400
                ? `${(s / 3600) | 0}h ago`
                : new Date(iso).toLocaleDateString();
        };
        const dur = (a, b) => {
          if (!a) return '';
          const s = ((b ? new Date(b) : new Date()) - new Date(a)) / 1000;
          return s < 60 ? `${s | 0}s` : `${(s / 60) | 0}m ${(s % 60) | 0}s`;
        };

        function renderRuns() {
          const box = $('#runs');
          box.replaceChildren(
            ...state.runs.map((r) =>
              el(
                'button',
                {
                  class: 'run-item',
                  type: 'button',
                  'aria-current': String(r.id === state.selected),
                  onclick: () => {
                    state.selected = r.id;
                    state.stage = null;
                    state.attempt = null;
                    setView('run');
                    refresh();
                  },
                },
                el('span', { class: 't' }, r.title),
                el(
                  'span',
                  { class: 'm' },
                  el('span', { class: `s-${r.status}` }, r.status),
                  el('span', { class: 'dots' }, r.stages.map((s) => DOT[s.status] || '○').join('')),
                  el('span', {}, ago(r.startedAt)),
                ),
              ),
            ),
          );
          if (!state.runs.length) box.replaceChildren(el('p', { class: 'hint empty' }, 'No runs yet. Tap New run to start one.'));
        }

        function currentStage(run) {
          if (state.stage && run.stages.some((s) => s.id === state.stage)) return run.stages.find((s) => s.id === state.stage);
          return (
            run.stages.find((s) => s.status === 'running') ||
            [...run.stages].reverse().find((s) => s.attempts.length) ||
            run.stages[0]
          );
        }

        async function renderRun() {
          const run = state.run;
          const c = $('#content');
          if (!run) {
            if (!state.runs.length) return;
            c.replaceChildren(el('div', { class: 'empty' }, 'Select a run.'));
            return;
          }
          const st = currentStage(run);
          const att = st.attempts.find((a) => a.n === state.attempt) || st.attempts[st.attempts.length - 1];

          const line = el(
            'div',
            { class: 'line', role: 'group', 'aria-label': 'Pipeline stages' },
            run.stages.map((s) =>
              el(
                'button',
                {
                  class: 'station',
                  type: 'button',
                  'data-status': s.status,
                  'aria-pressed': String(s.id === st.id),
                  onclick: () => {
                    state.stage = s.id;
                    state.attempt = null;
                    renderRun();
                  },
                },
                el(
                  'span',
                  { class: 'node', 'aria-hidden': 'true' },
                  s.status === 'passed' ? '✓' : s.status === 'failed' ? '✗' : ICON[s.id] || '?',
                ),
                el('span', { class: 'lbl' }, s.title),
                el(
                  'span',
                  { class: 'sub' },
                  `${s.agent || 'deterministic'}${s.attempts.length ? ` · ${s.attempts.length}×` : ''}`,
                ),
              ),
            ),
          );

          const checks = (att?.gate || []).map((g) =>
            el(
              'li',
              {},
              el(
                'span',
                { class: `ic ${g.ok ? 's-passed' : g.severity === 'warn' ? 's-cancelled' : 's-failed'}` },
                g.ok ? '✓' : g.severity === 'warn' ? '!' : '✗',
              ),
              el('span', {}, g.name),
              g.detail ? el('pre', {}, g.detail) : null,
            ),
          );

          const tabs = el(
            'div',
            { class: 'tabs' },
            st.attempts.map((a) =>
              el(
                'button',
                {
                  type: 'button',
                  'aria-pressed': String(att && a.n === att.n),
                  onclick: () => {
                    state.attempt = a.n;
                    renderRun();
                  },
                },
                `#${a.n}${a.ok ? ' ✓' : a.finishedAt ? ' ✗' : ' …'}`,
              ),
            ),
          );

          const logPre = el('pre', { class: 'log', id: 'log' }, att ? 'Loading log…' : 'No attempts yet.');
          c.replaceChildren(
            ...[
              el('button', { class: 'back', type: 'button', onclick: () => setView('list') }, '← Runs'),
              el(
                'div',
                { class: 'run-head' },
                el('h1', {}, run.title),
                el('span', { class: `badge s-${run.status}` }, run.status),
                run.status === 'running'
                  ? el(
                      'button',
                      {
                        type: 'button',
                        class: 'cancel',
                        onclick: async (ev) => {
                          ev.target.disabled = true;
                          ev.target.textContent = 'Cancelling…';
                          try {
                            await api(`/api/runs/${run.id}/cancel`, { method: 'POST' });
                          } catch {
                            /* the refresh below shows the outcome either way */
                          }
                          setTimeout(refresh, 400);
                        },
                      },
                      'Cancel run',
                    )
                  : null,
              ),
              el(
                'div',
                { class: 'meta' },
                el('span', {}, `run ${run.id}`),
                el('span', {}, `${run.executor} executor`),
                el('span', {}, `⏱ ${dur(run.startedAt, run.finishedAt)}`),
                el('span', {}, `$${(run.costUsd || 0).toFixed(2)}`),
                run.reviewLoops ? el('span', {}, `review loops ${run.reviewLoops}`) : null,
                run.branch ? el('span', {}, `⎇ ${run.branch}`) : null,
                run.prUrl && /^https:\/\/github\.com\//.test(run.prUrl)
                  ? el('a', { href: run.prUrl, target: '_blank', rel: 'noopener noreferrer' }, 'Pull request ↗')
                  : null,
                el('span', {}, `📁 ${run.artifactDir}/`),
              ),
              run.error ? el('p', { class: 'err' }, run.error) : null,
              line,
              el(
                'div',
                { class: 'grid2' },
                el(
                  'div',
                  { class: 'card' },
                  el('h3', {}, el('span', {}, `${st.title} gate`), tabs),
                  checks.length
                    ? el('ul', { class: 'checks' }, checks)
                    : el(
                        'p',
                        { class: 'hint', style: 'padding:12px' },
                        st.status === 'running' ? 'Agent working; gate runs when it finishes.' : 'Not run yet.',
                      ),
                  att?.summary ? el('div', { class: 'summary' }, att.summary) : null,
                  att?.error ? el('div', { class: 'summary s-failed' }, att.error) : null,
                ),
                el('div', { class: 'card' }, el('h3', {}, el('span', {}, att ? `Log · ${att.log}` : 'Log')), logPre),
              ),
              el('h2', {}, 'Launcher output'),
              el('div', { class: 'card' }, el('pre', { class: 'log', id: 'launcher-log' }, 'Loading…')),
              el('h2', {}, 'Events'),
              el(
                'div',
                { class: 'card' },
                el(
                  'ul',
                  { class: 'events' },
                  [...run.events].reverse().map((e) => el('li', {}, el('time', {}, new Date(e.at).toLocaleTimeString()), e.msg)),
                ),
              ),
            ].filter(Boolean),
          );

          if (state.launcherFor !== run.id) {
            state.launcherFor = run.id;
            try {
              const text = await api(`/api/runs/${run.id}/logs/launcher.txt`);
              const pre = $('#launcher-log');
              if (pre) pre.textContent = text || '(launcher produced no output)';
            } catch {
              const pre = $('#launcher-log');
              if (pre) pre.textContent = 'No launcher output — this run was not started from the dashboard.';
            }
          }
          if (att) {
            try {
              const text = await api(`/api/runs/${run.id}/logs/${att.log}`);
              const pre = $('#log');
              if (pre) {
                const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 20;
                pre.textContent = text;
                if (atBottom || state.logFor !== att.log) pre.scrollTop = pre.scrollHeight;
                state.logFor = att.log;
              }
            } catch {
              const pre = $('#log');
              if (pre) pre.textContent = 'Log not available yet.';
            }
          }
        }

        async function refresh() {
          try {
            state.runs = await api('/api/runs');
            if (!state.selected && state.runs[0]) state.selected = state.runs[0].id;
            renderRuns();
            state.run = state.selected ? await api(`/api/runs/${state.selected}`) : null;
            await renderRun();
          } catch (e) {
            console.error(e);
          }
        }

        api('/api/project')
          .then((p) => {
            $('#proj').textContent = `${p.name} · ${p.template} · ${p.dir}`;
          })
          .catch(() => {});

        const dlg = $('#dlg');
        $('#newBtn').onclick = () => {
          $('#formErr').textContent = '';
          dlg.showModal();
          // Focusing on open would pop the keyboard over the sheet on a phone.
          if (matchMedia('(min-width: 600px)').matches) $('#req').focus();
        };
        $('#cancel').onclick = () => dlg.close();
        $('#form').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const { id } = await api('/api/runs', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ request: $('#req').value, executor: $('#exec').value, ship: $('#ship').checked }),
            });
            dlg.close();
            $('#req').value = '';
            state.selected = id;
            state.stage = null;
            state.attempt = null;
            setView('run');
            setTimeout(refresh, 600);
          } catch (err) {
            $('#formErr').textContent = err.message;
          }
        });

        // ---- Improve page: digest, approval mode, proposals ----
        const money = (n) => (n === null || n === undefined ? '–' : `$${Number(n).toFixed(2)}`);
        async function act(id, action, btn) {
          const label = btn.textContent;
          btn.disabled = true;
          btn.textContent = '…';
          try {
            await api(`/api/improvements/${id}/${action}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ executor: $('#exec').value }),
            });
          } catch (err) {
            alert(err.message);
          }
          btn.disabled = false;
          btn.textContent = label;
          refreshImprove();
        }
        function proposalCard(p) {
          const b = (label, action, primary) =>
            el('button', { type: 'button', class: primary ? 'primary' : '', onclick: (e) => act(p.id, action, e.target) }, label);
          const acts = [];
          if (['open', 'recommended', 'needs-evidence'].includes(p.status))
            acts.push(b('Approve & run', 'approve', true), b('Reject', 'reject'));
          if (p.status === 'approved') acts.push(b('Run it', 'apply', true));
          if (p.status === 'applied' && p.apply?.commit) acts.push(b('Revert', 'revert'));
          return el(
            'div',
            { class: 'prop' },
            el('span', { class: 't' }, p.title),
            el(
              'span',
              { class: 'm' },
              el(
                'span',
                { class: `badge s-${p.status === 'applied' ? 'passed' : p.status === 'failed' ? 'failed' : 'pending'}` },
                p.status,
              ),
              el('span', { class: `risk-${p.risk}` }, `risk ${p.risk ?? '–'}`),
              el('span', {}, `score ${p.score ?? '–'}`),
              p.decision ? el('span', {}, `decider: ${p.decision.verdict}`) : null,
              p.approval?.by === 'auto' ? el('span', { class: 'risk-medium' }, 'auto-approved') : null,
              el('span', {}, p.id),
            ),
            el(
              'ul',
              {},
              p.claims.map((c) => el('li', {}, `${c.text} `, el('code', {}, `${c.fact} = ${c.value}`))),
            ),
            el(
              'details',
              { class: 'more' },
              el('summary', {}, 'Details'),
              el('p', { class: 'hint' }, el('b', {}, 'Why: '), p.lesson),
              el('p', { class: 'hint' }, el('b', {}, 'Change: '), p.change),
              el('p', { class: 'hint' }, el('b', {}, 'Targets: '), p.targets.join(', ')),
              p.decision?.reasoning ? el('p', { class: 'hint' }, el('b', {}, 'Decider: '), p.decision.reasoning) : null,
              p.apply?.runId
                ? el('p', { class: 'hint' }, el('b', {}, 'Run: '), p.apply.runId, p.apply.branch ? ` on ${p.apply.branch}` : '')
                : null,
            ),
            acts.length ? el('div', { class: 'acts' }, acts) : null,
          );
        }
        async function refreshImprove() {
          let data;
          try {
            data = await api('/api/improvements');
          } catch {
            return;
          }
          const d = data.digest;
          const e = d?.efficiency;
          const open = data.proposals.filter((p) =>
            ['open', 'recommended', 'needs-evidence', 'approved', 'applying'].includes(p.status),
          );
          const done = data.proposals.filter((p) => !open.includes(p));
          $('#improveBody').replaceChildren(
            ...[
              el(
                'div',
                { class: 'mode' },
                'Approval',
                el('span', { class: `badge ${data.approval.mode}` }, data.approval.mode),
                data.approval.mode === 'auto'
                  ? `self-applies risk ≤ ${data.approval.autoMaxRisk}; gates, security and release always wait for you`
                  : 'you approve every change',
              ),
              d
                ? el(
                    'div',
                    { class: 'card' },
                    el('h3', {}, el('span', {}, `Steward digest · ${d.runs} runs`), el('span', { class: 'hint' }, ago(d.at))),
                    el(
                      'div',
                      { class: 'stats' },
                      el('div', {}, el('b', {}, money(e.costPerPassedRun)), el('span', {}, 'cost per passed run')),
                      el(
                        'div',
                        {},
                        el(
                          'b',
                          {},
                          e.trend.recent === null || e.trend.earlier === null
                            ? '–'
                            : `${money(e.trend.recent)} / ${money(e.trend.earlier)}`,
                        ),
                        el('span', {}, 'recent / earlier'),
                      ),
                      el('div', {}, el('b', {}, money(e.retryWasteUsd)), el('span', {}, 'retry waste')),
                      el('div', {}, el('b', {}, String(e.reviewLoops)), el('span', {}, 'review loops')),
                    ),
                    d.watching.length
                      ? el(
                          'div',
                          { class: 'summary' },
                          `Watching: ${d.watching.map((w) => `${w.label} (${w.runs} runs)`).join('; ')}`,
                        )
                      : null,
                    d.thisPass.errors.length ? el('div', { class: 'summary s-failed' }, d.thisPass.errors.join('\n')) : null,
                  )
                : el('p', { class: 'hint' }, 'No Steward pass yet. Run factory steward after a few runs.'),
              el('h2', {}, `Proposals · ${open.length} open`),
              el(
                'div',
                { class: 'card' },
                open.length ? open.map(proposalCard) : el('p', { class: 'hint', style: 'padding:12px' }, 'Nothing waiting.'),
              ),
              done.length ? el('h2', {}, 'History') : null,
              done.length ? el('div', { class: 'card' }, done.slice(0, 20).map(proposalCard)) : null,
              data.warnings.length ? el('p', { class: 'err' }, data.warnings.join(' · ')) : null,
            ].filter(Boolean),
          );
        }
        $('#pageBtn').onclick = () => {
          const improve = document.body.dataset.page !== 'improve';
          document.body.dataset.page = improve ? 'improve' : 'runs';
          $('#pageBtn').textContent = improve ? 'Runs' : 'Improve';
          $('#pageBtn').setAttribute('aria-pressed', String(improve));
          window.scrollTo(0, 0);
          if (improve) refreshImprove();
        };

        refresh();
        setInterval(() => {
          if (document.hidden) return;
          if (document.body.dataset.page === 'improve') refreshImprove();
          else refresh();
        }, 2000);
      })();
    </script>
  </body>
</html>
