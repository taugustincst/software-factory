[project]
name = "{{factory.name}}"
version = "0.1.0"
description = "{{factory.description}}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "fastapi>=0.143.2",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.16.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.54.0",
]

# Console script: the Python equivalent of the TS templates' `db:migrate` npm script.
[project.scripts]
db-migrate = "app.migrate:main"

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", ".factory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM", "RUF", "PT", "ASYNC", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]  # synthetic test credentials only

[tool.mypy]
strict = true
packages = ["app"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=85"
