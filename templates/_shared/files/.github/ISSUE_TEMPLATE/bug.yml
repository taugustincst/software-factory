name: Bug report
description: Something is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: markdown
    attributes:
      value: "Remove secrets and real personal or patient data from logs and screenshots before posting."
