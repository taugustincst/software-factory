# Deploy — DISABLED BY DEFAULT.
#
# This workflow has no push, release or schedule trigger: it only runs when
# you start it by hand (Actions → Deploy → Run workflow), and even then the
# job is skipped unless the repository variable DEPLOY_ENABLED is set to
# "true" (Settings → Secrets and variables → Actions → Variables). Merging
# code never deploys anything until you opt in.
#
# What it does: build the project's Docker image and push it to GHCR as
# ghcr.io/<owner>/{{factory.name}}, tagged with the commit SHA and `latest`.
# It does not touch your server — you pull the new image there yourself
# (see "Deploy" in README.md and docker-compose.prod.yml).
#
# One-time setup:
#   1. Settings → Secrets and variables → Actions → Variables:
#      add DEPLOY_ENABLED = true when you are ready to publish images.
#   2. The workflow logs in to GHCR with the built-in GITHUB_TOKEN
#      (packages: write below); no extra secret is needed.
#   3. On the server, either make the package public (Package settings →
#      Change visibility) or `docker login ghcr.io` with a read-only token,
#      so `docker compose pull` can fetch the image.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    # Opt-in guard: skipped unless DEPLOY_ENABLED is exactly "true".
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
